apiVersion: v1 
kind: ConfigMap 
metadata:
  name: db-config
  namespace: redbus
data:
  ACCEPT_EULA: "Y"
  DB_NAME: "RedBusDB"
  DB_HOST: "ssms-svc"
  DB_PORT: "1433"
